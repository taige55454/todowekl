name: Build

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
    
    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v1.1
    
    - name: Setup MSVC
      uses: ilammy/msvc-dev-cmd@v1
      with:
        arch: x64
    
    - name: Build
      run: |
        cl.exe /EHsc /std:c++17 /O2 /D_UNICODE /DUNICODE /MT /nologo /c main.cpp app.cpp gfx.cpp storage.cpp json.cpp
        if ($LASTEXITCODE -ne 0) { exit 1 }
        link.exe /OUT:ToDoWell.exe /SUBSYSTEM:WINDOWS main.obj app.obj gfx.obj storage.obj json.obj d2d1.lib dwrite.lib ole32.lib shell32.lib user32.lib gdi32.lib /NOLOGO
        if ($LASTEXITCODE -ne 0) { exit 1 }
    
    - name: Upload artifact
      uses: actions/upload-artifact@v3
      with:
        name: ToDoWell-Windows
        path: ToDoWell.exe
    
    - name: Create Release
      if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
      uses: softprops/action-gh-release@v1
      with:
        tag_name: v1.0.${{ github.run_number }}
        name: Release v1.0.${{ github.run_number }}
        files: ToDoWell.exe
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
